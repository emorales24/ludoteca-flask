<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Mi Aplicación</title>
    <!-- Carga de Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fuente Inter para una apariencia moderna y legible */
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth; /* Desplazamiento suave para anclas */
        }
        /* Estilos para el contenedor principal para que ocupe toda la altura */
        .min-h-screen-minus-nav {
            min-height: calc(100vh - 4rem); /* Altura de la vista menos la altura del navbar */
        }
    </style>
</head>
<body class="bg-gray-800 text-gray-200">
    <!-- Navbar (similar a otras páginas para coherencia) -->
    <nav class="bg-blue-600 p-4 shadow-lg rounded-b-lg">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <!-- Título de la Aplicación / Logo -->
            <a href="/" class="text-white text-2xl font-bold hover:text-blue-200 transition duration-300 ease-in-out">
                MiApp
            </a>

            <!-- Input de Buscador (funcional en esta página también) -->
            <form action="/buscar" method="GET" class="relative w-full md:w-1/3">
                <input type="text" name="q" placeholder="Buscar..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg bg-blue-700 text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white focus:text-gray-800 transition duration-300 ease-in-out shadow-sm">
                <button type="submit" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-200 h-5 w-5 p-0 bg-transparent border-none cursor-pointer">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </form>

            <!-- Enlaces de Navegación -->
            <div class="flex flex-wrap justify-center md:justify-end space-x-4">
                <a href="/inicio" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">INICIO</a>
                <a href="#" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">CATEGORIAS</a>
                <a href="/perfil" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium underline">Mi Perfil</a>
                <a href="#" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">CONTACTO</a>
                <a href="#" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">Carrito</a>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal del Perfil -->
    <main class="container mx-auto p-6 flex flex-col lg:flex-row gap-6 min-h-screen-minus-nav">
        <!-- Panel Lateral (Sidebar) -->
        <aside class="lg:w-1/4 bg-gray-900 p-6 rounded-lg shadow-xl flex flex-col space-y-4">
            <h3 class="text-2xl font-bold text-blue-400 mb-4">Menú de Perfil</h3>
            <a href="#" class="block p-3 rounded-lg text-lg bg-blue-700 hover:bg-blue-800 transition duration-200 ease-in-out font-semibold">Mis Datos</a>
            <a href="#" class="block p-3 rounded-lg text-lg hover:bg-blue-700 transition duration-200 ease-in-out">Historial de Compras</a>
            <a href="#" class="block p-3 rounded-lg text-lg hover:bg-blue-700 transition duration-200 ease-in-out">Métodos de Pago</a>
        </aside>

        <!-- Sección de Contenido Principal del Perfil -->
        <section class="lg:w-3/4 bg-gray-900 p-8 rounded-lg shadow-xl">
            <h2 class="text-3xl font-bold text-blue-400 mb-8">Información de la Cuenta</h2>

            <!-- Información de la Cuenta -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label for="username" class="block text-gray-400 text-sm font-medium mb-1">Nombre de Usuario</label>
                    <input type="text" id="username" value="pepegamer" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div>
                    <label for="email" class="block text-gray-400 text-sm font-medium mb-1">Correo</label>
                    <input type="email" id="email" value="Pepe@gmail.com" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div class="md:col-span-2">
                    <label for="password" class="block text-gray-400 text-sm font-medium mb-1">Contraseña</label>
                    <input type="password" id="password" value="*********" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
            </div>

            <h2 class="text-3xl font-bold text-blue-400 mb-8">Datos Personales</h2>

            <!-- Datos Personales -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label for="nombre" class="block text-gray-400 text-sm font-medium mb-1">Nombre</label>
                    <input type="text" id="nombre" value="Pepe" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div>
                    <label for="apellido" class="block text-gray-400 text-sm font-medium mb-1">Apellido</label>
                    <input type="text" id="apellido" value="Gomez" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
            </div>

            <h2 class="text-3xl font-bold text-blue-400 mb-8">Dirección</h2>

            <!-- Dirección -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div>
                    <label for="calle" class="block text-gray-400 text-sm font-medium mb-1">Calle</label>
                    <input type="text" id="calle" value="Paseo Colon" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div>
                    <label for="numero" class="block text-gray-400 text-sm font-medium mb-1">Número</label>
                    <input type="text" id="numero" value="850" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div>
                    <label for="codigo_postal" class="block text-gray-400 text-sm font-medium mb-1">Código Postal</label>
                    <input type="text" id="codigo_postal" value="1063" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div>
                    <label for="ciudad" class="block text-gray-400 text-sm font-medium mb-1">Ciudad</label>
                    <input type="text" id="ciudad" value="CABA" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
                <div>
                    <label for="pais" class="block text-gray-400 text-sm font-medium mb-1">País</label>
                    <input type="text" id="pais" value="ARGENTINA" readonly
                           class="w-full p-3 rounded-md bg-gray-700 text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-default">
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex justify-end space-x-4 mt-8">
                <button class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-md shadow-md hover:bg-blue-700 transition duration-200 ease-in-out">
                    Editar
                </button>
                <button class="px-6 py-3 bg-red-600 text-white font-semibold rounded-md shadow-md hover:bg-red-700 transition duration-200 ease-in-out">
                    Eliminar
                </button>
            </div>
        </section>
    </main>

    <!-- Footer (similar a otras páginas para coherencia) -->
    <footer class="bg-gray-800 text-white p-4 text-center mt-12 rounded-t-lg">
        <div class="container mx-auto">
            <p>&copy; 2024 MiApp. Todos los derechos reservados.</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a href="#" class="hover:text-blue-400 transition duration-300 ease-in-out">Política de Privacidad</a>
                <a href="#" class="hover:text-blue-400 transition duration-300 ease-in-out">Términos de Servicio</a>
            </div>
        </div>
    </footer>
</body>
</html>
