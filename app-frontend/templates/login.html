<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="body-login">
    <div class="login-container">
        <h2 class="login-title">Iniciar Sesión</h2>
        <form id="loginForm" class="login-form" method="POST">
            <!--  se muestra el error si lo hay -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class=flashes>
                    {% for message in messages %}
                        
                        <div class="login-error">{{ message }}</div>
                        
                    {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
            <div>
                <label for="usuario" class="login-label">Nombre de Usuario</label>
                <input type="text" id="usuario" name="usuario" required class="login-input">
            </div>
            <div>
                <label for="contra" class="login-label">Contraseña</label>
                <input type="password" id="contra" name="contra" required class="login-input">
            </div>
            <button type="submit" class="login-button">Ingresar</button>
        </form>

        <br>

        <button type="submit" class="login-button" >
               <a href="{{ url_for('index') }}">Entrar sin iniciar sesion</a> 
        </button>
    </div>
</body>
</html>
