<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="body-login">
    <div class="login-container">
        <h2 class="login-title">Iniciar Sesión</h2>
        <form id="loginForm" class="login-form">
            <div>
                <label for="usuario" class="login-label">Nombre de Usuario</label>
                <input type="text" id="usuario" name="usuario" required class="login-input">
            </div>
            <div>
                <label for="contraseña" class="login-label">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" required class="login-input">
            </div>
            <button type="submit" class="login-button">
                Ingresar
            </button>


            <div id="message" class="login-error hidden">
                <!--  se muestra el error si lo hay -->
            </div>
        </form>

        <br>

        <button type="submit" class="login-button" >
               <a href="{{ url_for('index') }}">Entrar sin iniciar sesion</a> 
        </button>
    </div>
</body>
</html>
