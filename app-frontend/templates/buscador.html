{% extends 'base.html' %}

{% block body %}
    <!-- Contenido Principal - Resultados de búsqueda -->
    <main class="container mx-auto p-6 space-y-8">
        <h2 class="text-3xl font-bold text-center text-gray-300">Resultados de Búsqueda</h2>
        <p id="searchQueryDisplay" class="text-center text-gray-400 text-lg mb-6"></p>
        <div id="searchResults" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los resultados de la búsqueda se inyectarán aquí -->
        </div>
        <p id="noResults" class="text-center text-gray-400 text-lg hidden">No se encontraron juegos para tu búsqueda.</p>
    </main>
{% endblock %}
