<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Juegos - Mi Aplicación</title>
    <!-- Carga de Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fuente Inter para una apariencia moderna y legible */
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth; /* Desplazamiento suave para anclas */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navbar (similar al de inicio.html para coherencia) -->
    <nav class="bg-blue-600 p-4 shadow-lg sticky top-0 z-50 rounded-b-lg">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <!-- Título de la Aplicación / Logo -->
            <a href="/" class="text-white text-2xl font-bold hover:text-blue-200 transition duration-300 ease-in-out">
                MiApp
            </a>

            <!-- Input de Buscador (funcional en esta página también) -->
            <form action="/buscar" method="GET" class="relative w-full md:w-1/3">
                <input type="text" id="searchInput" name="q" placeholder="Buscar..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg bg-blue-700 text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white focus:text-gray-800 transition duration-300 ease-in-out shadow-sm">
                <button type="submit" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-200 h-5 w-5 p-0 bg-transparent border-none cursor-pointer">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </form>

            <!-- Enlaces de Navegación (Ejemplo) -->
            <div class="flex flex-wrap justify-center md:justify-end space-x-4">
                <a href="#" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">Categorías</a>
                <a href="#" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">Ofertas</a>
                <a href="#" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">Contacto</a>
                <a href="/login" class="text-white hover:text-blue-200 transition duration-300 ease-in-out font-medium">Mi Cuenta</a>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal - Resultados de búsqueda -->
    <main class="container mx-auto p-6 space-y-8">
        <h2 class="text-3xl font-bold text-center text-gray-800">Resultados de Búsqueda</h2>
        <p id="searchQueryDisplay" class="text-center text-gray-600 text-lg mb-6"></p>
        <div id="searchResults" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los resultados de la búsqueda se inyectarán aquí con JavaScript -->
        </div>
        <p id="noResults" class="text-center text-gray-600 text-lg hidden">No se encontraron juegos para tu búsqueda.</p>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 text-center mt-12 rounded-t-lg">
        <div class="container mx-auto">
            <p>&copy; 2024 MiApp. Todos los derechos reservados.</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a href="#" class="hover:text-blue-400 transition duration-300 ease-in-out">Política de Privacidad</a>
                <a href="#" class="hover:text-blue-400 transition duration-300 ease-in-out">Términos de Servicio</a>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchParams = new URLSearchParams(window.location.search);
            const query = searchParams.get('q'); // Obtiene el término de búsqueda de la URL
            const searchResultsContainer = document.getElementById('searchResults');
            const noResultsMessage = document.getElementById('noResults');
            const searchQueryDisplay = document.getElementById('searchQueryDisplay');
            const searchInput = document.getElementById('searchInput'); // Obtener el input de búsqueda en esta página

            // Rellenar el input de búsqueda con la query actual si existe
            if (query) {
                searchInput.value = query;
                searchQueryDisplay.textContent = `Mostrando resultados para: "${query}"`;
                fetchGames(query); // Llama a la función para obtener y mostrar los juegos
            } else {
                searchQueryDisplay.textContent = 'Por favor, introduce un término de búsqueda.';
                noResultsMessage.textContent = 'Introduce un término de búsqueda para ver resultados.';
                noResultsMessage.classList.remove('hidden');
            }

            async function fetchGames(searchQuery) {
                try {
                    // Realiza la solicitud al endpoint API de tu backend
                    const response = await fetch(`/api/juegos/buscar?q=${encodeURIComponent(searchQuery)}`);
                    const games = await response.json(); // Parsea la respuesta JSON

                    searchResultsContainer.innerHTML = ''; // Limpiar resultados anteriores
                    if (games.length > 0) {
                        noResultsMessage.classList.add('hidden'); // Ocultar mensaje de "no resultados"
                        games.forEach(game => {
                            const gameCard = document.createElement('div');
                            gameCard.className = 'bg-white rounded-lg shadow-md overflow-hidden transform hover:scale-105 transition duration-300 ease-in-out relative';

                            let offerBadge = '';
                            let displayPrice = game.precio;
                            if (game.en_oferta && game.porcentaje_oferta > 0) {
                                // Calcula el precio con descuento
                                const discountedPrice = game.precio * (1 - game.porcentaje_oferta / 100);
                                offerBadge = `
                                    <span class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">
                                        -${game.porcentaje_oferta}%
                                    </span>
                                `;
                                displayPrice = discountedPrice.toFixed(2); // Formatear a 2 decimales
                            }

                            // Construye el HTML para cada tarjeta de juego
                            gameCard.innerHTML = `
                                ${offerBadge}
                                <img src="${game.direccion_imagen || 'https://placehold.co/600x400/CCCCCC/000000?text=Imagen+No+Disponible'}"
                                     alt="${game.nombre}" class="w-full h-48 object-cover">
                                <div class="p-4">
                                    <h3 class="text-xl font-semibold mb-2">${game.nombre}</h3>
                                    <p class="text-gray-700 font-bold text-lg">
                                        Precio: $${displayPrice}
                                        ${game.en_oferta && game.porcentaje_oferta > 0 ? `<span class="line-through text-gray-500 text-sm ml-2">$${game.precio.toFixed(2)}</span>` : ''}
                                    </p>
                                    <p class="text-gray-600 text-sm mt-2">Género: ${game.nombre_genero || 'N/A'}</p>
                                    <p class="text-gray-600 text-sm">Tipo: ${game.tipo || 'N/A'}</p>
                                </div>
                            `;
                            searchResultsContainer.appendChild(gameCard); // Añade la tarjeta al contenedor de resultados
                        });
                    } else {
                        noResultsMessage.classList.remove('hidden'); // Muestra mensaje de "no resultados"
                    }
                } catch (error) {
                    console.error('Error al obtener juegos:', error);
                    searchResultsContainer.innerHTML = '<p class="text-red-500 text-center">Ocurrió un error al cargar los juegos. Por favor, inténtalo de nuevo más tarde.</p>';
                }
            }
        });
    </script>
</body>
</html>
