<div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasCart" aria-labelledby="MyCart">
    <div class="offcanvas-header justify-content-center">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <div class="order-md-last">
        <ul class="list-group mb-3">
          {% for item in carrito %}
          <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
              <h6 class="my-0">{{ item.nombre }}</h6>
              <small class="text-body-secondary">{{ item.descripcion }}</small>
            </div>
            <span class="text-body-secondary">${{ item.precio }}</span>
          </li>
          {% endfor %}
          <li class="list-group-item d-flex justify-content-between">
            <span>Total</span>
            <strong>${{ total }}</strong>
          </li>
        </ul>
        <button class="w-100 btn btn-primary btn-lg" type="submit">Finalizar la compra</button>
      </div>
    </div>
  </div>
