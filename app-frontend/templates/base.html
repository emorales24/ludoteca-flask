<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Ludoteca F&F{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <meta name="author" content="TemplatesJungle">
  <meta name="description" content="Ludoteca F&F - Tienda de juegos">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/vendor.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Jost&family=Marcellus&display=swap" rel="stylesheet">

  {% block auxiliarlink %} {% endblock %}

</head>

<body class="homepage">

  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  </svg>

{% block header %}
  {% include 'header.html' %}
{% endblock %}


  <main class="container">
    {% block content %}{% endblock %}
  </main>

{% block footer %}
{% include 'footer.html' %}
{% endblock %}




  <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/plugins.js') }}"></script>
  <script src="{{ url_for('static', filename='js/SmoothScroll.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.min.js') }}"></script>

</body>
</html>
