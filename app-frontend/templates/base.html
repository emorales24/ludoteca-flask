<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Mi Aplicación</title>
    <!-- Carga de Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style_nuevo.css', _external=True) }}">

</head>
<body class="bg-slate-700 text-gray-800">
    {% include 'header.html' %}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class=flashes>
            {% for message in messages %}
                <li class="mx-auto my-4 max-w-md rounded-lg bg-red-100 border border-red-400 text-red-700 text-center p-4">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    {% block body %}{% endblock %}

    {% include 'footer.html' %}

    <script src="{{ url_for('static', filename='js/script.js', _external=True) }}"></script>
</body>
</html>
